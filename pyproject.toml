[project]
name = "seo-analyzer"
version = "0.1.0"
description = "Діагностика сторінки проти конкурентів із видачі Google: інтент, BM25F, ембединги, внутрішній граф, посилання, AI Overviews"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "lxml>=5",
    "beautifulsoup4>=4.12",
    "trafilatura>=2.0",
    "networkx>=3.2",
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "pymorphy3>=2.0",
    "pymorphy3-dicts-uk",
    "snowballstemmer>=2.2",
    "wordfreq>=3.0",
    "jinja2>=3.1",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.40", "pandas>=2.0"]
local = ["fastembed>=0.5"]
gsc = ["google-auth>=2.0", "google-api-python-client>=2.0"]
dev = ["pytest>=8"]

[project.scripts]
seo-analyzer = "seo_analyzer.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["seo_analyzer", "seo_analyzer.modules"]

[tool.setuptools.package-data]
seo_analyzer = ["templates/*.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
